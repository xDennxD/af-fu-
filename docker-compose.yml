# Lokale WordPress-Entwicklungsumgebung (Ubuntu, Raspberry Pi – alle Images sind Multi-Arch/arm64).
#
#   docker compose up -d        → http://localhost:8080  (Erst-Setup: bin/setup.sh)
#   docker compose run --rm cli theme list
#   docker compose down -v      → alles inkl. Datenbank löschen
#
# Das Theme wird per Bind-Mount eingehängt: Änderungen unter wp-content/themes/fusspflege
# sind sofort im Browser sichtbar (kein Neustart nötig).

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      # Fehler nur ins Log (wp-content/debug.log), nicht auf die Seite.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/fusspflege:/var/www/html/wp-content/themes/fusspflege

  # WP-CLI: nur bei Bedarf per "docker compose run --rm cli <befehl>".
  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/fusspflege:/var/www/html/wp-content/themes/fusspflege

volumes:
  db_data:
  wp_data:
